name: CI

on:
  push:
    branches: [ '*' ]
  pull_request:
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install PowerShell modules
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module -Name GitHubCli -Force -Scope CurrentUser
          Install-Module -Name GitlabCli -Force -Scope CurrentUser

      - name: Run Pester tests
        id: pester
        shell: pwsh
        run: |
          Import-Module Pester
          $Config = New-PesterConfiguration
          $Config.Run.Path = "./tests"
          $Config.Run.Exit = $false
          $Config.Run.PassThru = $true
          $Config.TestResult.Enabled = $true
          $Config.TestResult.OutputPath = "TestResults.xml"
          $Config.TestResult.OutputFormat = "JUnitXml"
          $Result = Invoke-Pester -Configuration $Config

          $Summary = "## Test Results`n`n"
          $Summary += "| ✅ Passed | ❌ Failed | ⏭️ Skipped | Total |`n"
          $Summary += "|-----------|-----------|------------|-------|`n"
          $Summary += "| $($Result.PassedCount) | $($Result.FailedCount) | $($Result.SkippedCount) | $($Result.TotalCount) |`n"

          if ($Result.FailedCount -gt 0) {
            $Summary += "`n### Failed Tests`n`n"
            foreach ($test in $Result.Failed) {
              $Summary += "- **$($test.Name)**`n"
              $Summary += "  - $($test.ErrorRecord.Exception.Message)`n"
            }
          }

          $Summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

          if ($Result.FailedCount -gt 0) {
            exit 1
          }

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results
          path: TestResults.xml

  security:
    name: Run Security Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $Results = './src', './build' | Invoke-ScriptAnalyzer -Recurse -Settings ./PSScriptAnalyzerSettings.ps1 -ReportSummary

          $Errors = $Results | Where-Object Severity -eq 'Error'
          $Warnings = $Results | Where-Object Severity -eq 'Warning'
          $Info = $Results | Where-Object Severity -eq 'Information'

          $Summary = "## Security Analysis Results`n`n"
          $Summary += "| ❌ Errors | ⚠️ Warnings | ℹ️ Info |`n"
          $Summary += "|-----------|-------------|---------|`n"
          $Summary += "| $($Errors.Count) | $($Warnings.Count) | $($Info.Count) |`n`n"

          $Grouped = $Results | Group-Object Severity, RuleName | Sort-Object Count -Descending
          if ($Grouped) {
            $Summary += "| Rule | Count |`n"
            $Summary += "|------|-------|`n"
            foreach ($g in $Grouped) {
              $Severity = ($g.Name -split ', ')[0]
              $Rule = ($g.Name -split ', ')[1]
              $Icon = switch ($Severity) { 'Error' { '❌' } 'Warning' { '⚠️' } default { 'ℹ️' } }
              $Summary += "| $Icon ``$Rule`` | $($g.Count) |`n"
            }
          }

          $Summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

          $Results | ConvertTo-Json -Depth 5 | Out-File -FilePath SecurityResults.json

          if ($Results) {
            $Results | Format-Table
            if ($Errors.Count -gt 0) {
              Write-Host "Script analysis found errors" -ForegroundColor Red
              exit 1
            }
            if ($Warnings.Count -gt 0) {
              Write-Host "Script analysis found warnings" -ForegroundColor Yellow
              exit 2
            }
            Write-Host "Script analysis found informational issues only" -ForegroundColor Cyan
          }

      - name: Upload security results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: security-results
          path: SecurityResults.json

  docs:
    name: Validate Docs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install PowerShell modules
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module -Name Microsoft.PowerShell.PlatyPS -Force -Scope CurrentUser
          Install-Module -Name GitHubCli -Force -Scope CurrentUser
          Install-Module -Name GitlabCli -Force -Scope CurrentUser

      - name: Validate markdown help
        shell: pwsh
        run: |
          ./docs/.support/scripts/Update-Help.ps1 -ThrowOnChanges

          Import-Module Microsoft.PowerShell.PlatyPS
          $DocsFolder = "./docs"
          $MdFiles = Measure-PlatyPSMarkdown -Path (Join-Path $DocsFolder '*/*.md') -ErrorAction SilentlyContinue
          $Documented = ($MdFiles | Where-Object Filetype -match 'CommandHelp').Count

          $Summary = "## Documentation`n`n"
          $Summary += "Documented cmdlets: **$Documented**`n"
          $Summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

  release:
    name: Release
    needs: [test, security, docs]
    if: github.event.repository.fork == false && github.event_name == 'release'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    environment:
      name: PowerShell Gallery
      url: https://www.powershellgallery.com/packages/ForgeCli

    env:
      VERSION: ${{ github.event.release.tag_name }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install PowerShell modules
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module -Name Microsoft.PowerShell.PlatyPS -Force -Scope CurrentUser
          Install-Module -Name GitHubCli -Force -Scope CurrentUser
          Install-Module -Name GitlabCli -Force -Scope CurrentUser

      - name: Promote the changelog's Unreleased section into this version
        shell: pwsh
        run: ./build/Update-ReleaseArtifacts.ps1 -Version $env:VERSION -NotesOutputPath "$env:RUNNER_TEMP/release-notes.md"

      - name: Export help
        shell: pwsh
        run: ./docs/.support/scripts/Export-Help.ps1

      - name: Publish PowerShell Module
        uses: chris-peterson/publish-powershell@v1
        with:
          ApiKey: ${{ secrets.PSGALLERY_API_KEY }}

      - name: Set the release body to the promoted notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${VERSION}" --notes-file "${RUNNER_TEMP}/release-notes.md"

      # Last, so a failed publish leaves main without a commit claiming a
      # release that never shipped.
      - name: Commit version bump and changelog to main
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ForgeCli/ForgeCli.psd1 CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No manifest or changelog changes to commit"
          else
            git commit -m "Release ${VERSION}"
            git push origin main
          fi
